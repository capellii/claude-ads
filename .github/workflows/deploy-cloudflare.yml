name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - claude/claude-ads-project-6o8r3b
    paths:
      - 'anasy-ads/**'
      - '.github/workflows/deploy-cloudflare.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anasy-ads

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build for Cloudflare Workers
        run: npx opennextjs-cloudflare build
        env:
          NODE_ENV: production

      - name: Set Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          echo "${{ secrets.DATABASE_URL }}" | npx wrangler secret put DATABASE_URL
          echo "${{ secrets.DATABASE_URL_DIRECT }}" | npx wrangler secret put DATABASE_URL_DIRECT
          echo "${{ secrets.UPSTASH_REDIS_REST_URL }}" | npx wrangler secret put UPSTASH_REDIS_REST_URL
          echo "${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" | npx wrangler secret put NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
          echo "${{ secrets.CLERK_SECRET_KEY }}" | npx wrangler secret put CLERK_SECRET_KEY
          echo "${{ secrets.ANTHROPIC_API_KEY }}" | npx wrangler secret put ANTHROPIC_API_KEY
          echo "${{ secrets.GOOGLE_ADS_CLIENT_ID }}" | npx wrangler secret put GOOGLE_ADS_CLIENT_ID
          echo "${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}" | npx wrangler secret put GOOGLE_ADS_CLIENT_SECRET
          echo "${{ secrets.META_APP_ID }}" | npx wrangler secret put META_APP_ID
          echo "${{ secrets.META_APP_SECRET }}" | npx wrangler secret put META_APP_SECRET

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
