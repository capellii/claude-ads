name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - claude/claude-ads-project-6o8r3b
    paths:
      - 'anasy-ads/**'
      - '.github/workflows/deploy-cloudflare.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anasy-ads

    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$CF_TOKEN" ]   && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CF_ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "❌ Missing required secrets:$missing"
            echo ""
            echo "Add them at: https://github.com/capellii/claude-ads/settings/secrets/actions"
            echo "  CLOUDFLARE_API_TOKEN  → https://dash.cloudflare.com/profile/api-tokens"
            echo "  CLOUDFLARE_ACCOUNT_ID → Cloudflare dashboard right sidebar"
            exit 1
          fi
          echo "✅ Required secrets present"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build for Cloudflare Workers
        run: npx opennextjs-cloudflare build
        env:
          NODE_ENV: production

      - name: Set Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          put_secret() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              echo "$value" | npx wrangler secret put "$name"
            else
              echo "⚠️  Skipping $name (secret not set)"
            fi
          }
          put_secret DATABASE_URL                      "${{ secrets.DATABASE_URL }}"
          put_secret DATABASE_URL_DIRECT               "${{ secrets.DATABASE_URL_DIRECT }}"
          put_secret UPSTASH_REDIS_REST_URL            "${{ secrets.UPSTASH_REDIS_REST_URL }}"
          put_secret NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY "${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}"
          put_secret CLERK_SECRET_KEY                  "${{ secrets.CLERK_SECRET_KEY }}"
          put_secret ANTHROPIC_API_KEY                 "${{ secrets.ANTHROPIC_API_KEY }}"
          put_secret GOOGLE_ADS_CLIENT_ID              "${{ secrets.GOOGLE_ADS_CLIENT_ID }}"
          put_secret GOOGLE_ADS_CLIENT_SECRET          "${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}"
          put_secret META_APP_ID                       "${{ secrets.META_APP_ID }}"
          put_secret META_APP_SECRET                   "${{ secrets.META_APP_SECRET }}"

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
